<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif">
  <rect width="1180" height="560" fill="#F8FAFC"/>
  <text x="590" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#2D3748">cspub 发文数据流：一条命令，从 Markdown 到 CSDN 文章</text>

  <!-- 步骤1 输入 -->
  <rect x="40" y="100" width="200" height="110" rx="10" fill="#0891B2"/>
  <text x="140" y="145" text-anchor="middle" font-size="16" fill="#FFFFFF">① Markdown 文章</text>
  <text x="140" y="172" text-anchor="middle" font-size="13" fill="#E0F2FE">front-matter 元数据</text>
  <text x="140" y="192" text-anchor="middle" font-size="13" fill="#E0F2FE">正文 + 外链图片</text>

  <!-- 步骤2 图片转存 -->
  <rect x="320" y="100" width="210" height="110" rx="10" fill="#E99151"/>
  <text x="425" y="145" text-anchor="middle" font-size="16" fill="#FFFFFF">② 图片自动转存</text>
  <text x="425" y="172" text-anchor="middle" font-size="13" fill="#FFEDD5">扫描外链图 → 拦截内网</text>
  <text x="425" y="192" text-anchor="middle" font-size="13" fill="#FFEDD5">上传 CSDN 图床</text>

  <!-- 步骤3 渲染 -->
  <rect x="600" y="100" width="200" height="110" rx="10" fill="#E99151"/>
  <text x="700" y="145" text-anchor="middle" font-size="16" fill="#FFFFFF">③ Markdown → HTML</text>
  <text x="700" y="172" text-anchor="middle" font-size="13" fill="#FFEDD5">标题/列表/代码围栏</text>
  <text x="700" y="192" text-anchor="middle" font-size="13" fill="#FFEDD5">图片/链接/行内代码</text>

  <!-- 步骤4 签名 -->
  <rect x="870" y="100" width="220" height="110" rx="10" fill="#7C3AED"/>
  <text x="980" y="145" text-anchor="middle" font-size="16" fill="#FFFFFF">④ 网关 HMAC 签名</text>
  <text x="980" y="172" text-anchor="middle" font-size="13" fill="#EDE9FE">HMAC-SHA256（x-ca-*）</text>
  <text x="980" y="192" text-anchor="middle" font-size="13" fill="#EDE9FE">对齐 CSDN 前端同款算法</text>

  <!-- 步骤5 CSDN -->
  <rect x="180" y="300" width="260" height="120" rx="10" fill="#64748B"/>
  <text x="310" y="345" text-anchor="middle" font-size="16" fill="#FFFFFF">⑤ CSDN 服务端</text>
  <text x="310" y="372" text-anchor="middle" font-size="13" fill="#E2E8F0">图床接口（华为 OBS）</text>
  <text x="310" y="392" text-anchor="middle" font-size="13" fill="#E2E8F0">发文接口 bizapi.csdn.net</text>

  <!-- 步骤6 产物 -->
  <rect x="580" y="300" width="260" height="120" rx="10" fill="#4CA497"/>
  <text x="710" y="345" text-anchor="middle" font-size="16" fill="#FFFFFF">⑥ 发布产物</text>
  <text x="710" y="372" text-anchor="middle" font-size="13" fill="#D1FAE5">文章链接 + 文章 id</text>
  <text x="710" y="392" text-anchor="middle" font-size="13" fill="#D1FAE5">默认草稿，--live 直发</text>

  <!-- 底部仓颉标签 -->
  <rect x="900" y="470" width="230" height="52" rx="10" fill="none" stroke="#005D7B" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1015" y="494" text-anchor="middle" font-size="14" fill="#2D3748">全程仓颉实现</text>
  <text x="1015" y="512" text-anchor="middle" font-size="12" fill="#64748B">stdx: crypto / http / json</text>

  <!-- 主干连线 -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <line x1="240" y1="155" x2="318" y2="155" marker-end="url(#arr)"/>
    <line x1="530" y1="155" x2="598" y2="155" marker-end="url(#arr)"/>
    <line x1="800" y1="155" x2="868" y2="155" marker-end="url(#arr)"/>
    <line x1="980" y1="210" x2="980" y2="270" marker-end="url(#arr)"/>
    <line x1="980" y1="270" x2="445" y2="270"/>
    <line x1="310" y1="270" x2="310" y2="298" marker-end="url(#arr)"/>
    <line x1="440" y1="360" x2="578" y2="360" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- 连线标签 -->
  <text x="279" y="145" text-anchor="middle" font-size="13" fill="#64748B">publish</text>
  <text x="564" y="145" text-anchor="middle" font-size="13" fill="#64748B">渲染</text>
  <text x="834" y="145" text-anchor="middle" font-size="13" fill="#64748B">签名</text>
  <text x="700" y="262" text-anchor="middle" font-size="13" fill="#64748B">POST + Cookie</text>
  <text x="509" y="350" text-anchor="middle" font-size="13" fill="#64748B">返回链接</text>
</svg>
